timing: True
debug: False
stop_at_error: True

# 3x2pt (cosmic shear, galaxy-galaxy lensing, galaxy clustering) on the DES
# Y3 placeholder data set: the galaxy-only likelihoods of this project
# (cosmic_shear, combo_3x2pt, combo_2x2pt) read data/des_y3_real.dataset, a
# copy of the DES Y3 3x2pt data set of the project des_y3 (redMaGiC lenses,
# 5 bins; Metacalibration sources, 4 bins).
# The data vector is the DES Y3 measurement and the point of the evaluate
# block below is not a fit to it, so chi2 sits far from its minimum there
# (unlike EXAMPLE_EVALUATE1/2, whose synthetic data vector is the model).
# The unit tests evaluate this point against a model vector generated at
# it (tests/test_example4.py).
# 2x2pt (galaxy-galaxy lensing and galaxy clustering): rename the likelihood
# below to des_cluster.combo_2x2pt; every option, the data and the point
# stay the same (tests/test_example4_2x2pt.py).
likelihood:
  des_cluster.combo_3x2pt:
    path: ./external_modules/data/des_cluster
    data_file: des_y3_real.dataset
    print_datavector: False
    print_datavector_file: "./projects/des_cluster/chains/theory_3x2pt.modelvector"
    # WARNING: keep accuracyboost <= 3 (above it the integration tables of the
    # donor project desy1xplanck broke down; not re-measured here).
    accuracyboost: 1.0
    # integer 0, 1 or 2; 0 is the default of the galaxy-only likelihoods (the
    # cluster combinations need 1 for the Y6 MagLim lens n(z), whose tails
    # reach z = 2.99; the redMaGiC lens n(z) of this data set end at z = 1.49)
    integration_accuracy: 0
    lmax: 75000 # lmax computed for real space correlation function
    kmax_boltzmann: 10.0
    # 1 EE2, 2 Halofit
    non_linear_emul: 2
    IA_model: 0 # NLA (0) or TATT (1)
    IA_code: 0  # CFASTPT (0) or FASTPT (1) (only works if not NLA)
    IA_redshift_evolution: 3
    debug: false
    # galaxy-galaxy lensing: 1 = Limber at every multipole, 0 = non-Limber
    # below l = 150
    adopt_limber_gs: 1
    # galaxy clustering: 0 = non-Limber below l = 150, 1 = Limber at every
    # multipole
    adopt_limber_gg: 0

params:
  As_1e9:
    prior:
      min: 0.5
      max: 5
    ref:
      dist: norm
      loc: 2.1
      scale: 0.2
    proposal: 0.2
    latex: 10^9 A_\mathrm{s}
    drop: true
    renames: A
  ns:
    prior:
      min: 0.87
      max: 1.07
    ref:
      dist: norm
      loc: 0.96605
      scale: 0.01
    proposal: 0.01
    latex: n_\mathrm{s}
  H0:
    prior:
      min: 55
      max: 91
    ref:
      dist: norm
      loc: 67.32
      scale: 3
    proposal: 3
    latex: H_0
  omegab:
    prior:
      min: 0.03
      max: 0.07
    ref:
      dist: norm
      loc: 0.0495
      scale: 0.004
    proposal: 0.004
    latex: \Omega_\mathrm{b}
    drop: true
  omegam:
    prior:
      min: 0.1
      max: 0.9
    ref:
      dist: norm
      loc: 0.316
      scale: 0.015
    proposal: 0.015
    latex: \Omega_\mathrm{m}
    drop: true
  w:
    prior:
      min: -3
      max: -0.01
    ref:
      dist: norm
      loc: -0.99
      scale: 0.05
    proposal: 0.05
    latex: w_{0,\mathrm{DE}}
  w0pwa:
    prior:
      min: -5
      max: -0.01
    ref:
      dist: norm
      loc: -0.99
      scale: 0.05
    proposal: 0.05
    latex: w_{0,\mathrm{DE}}+w_{a,\mathrm{DE}}
    drop: true
  wa:
    value: 'lambda w0pwa, w: w0pwa - w'
    latex: w_{a,\mathrm{DE}}
  mnu:
    prior:
      min: 0.06
      max: 0.6
    ref:
      dist: norm
      loc: 0.25
      scale: 0.1
    proposal: 0.05
  tau:
    value: 0.0697186
    latex: \tau_\mathrm{reio}
  # ---------------------------------------------------------------------------------------
  # ------------------------------------- DERIVED PARAMETERS ------------------------------
  # ---------------------------------------------------------------------------------------
  # WARNING: DO NOT REMOVE omegabh2/omegach2/omegamh2/wa/As/ FROM DERIVED PARAMETERS
  # SEE: github.com/CosmoLike/cocoa#warning-warning-warning-weak-lensing-yaml-files-in-cobaya-
  # ---------------------------------------------------------------------------------------
  As:
    value: 'lambda As_1e9: 1e-9 * As_1e9'
    latex: A_\mathrm{s}
  omegabh2:
    value: 'lambda omegab, H0: omegab*(H0/100)**2'
    latex: \Omega_\mathrm{b} h^2
  omegach2:
    value: 'lambda omegam, omegab, mnu, H0: (omegam-omegab)*(H0/100)**2-(mnu*(3.046/3)**0.75)/94.0708'
    latex: \Omega_\mathrm{c} h^2
  omegal:
    latex: \Omega_\Lambda
  omegamh2:
    derived: 'lambda omegam, H0: omegam*(H0/100)**2'
    latex: \Omega_\mathrm{m} h^2
  sigma8:
    latex: \sigma_8
  s8h5:
    derived: 'lambda sigma8, H0: sigma8*(H0*1e-2)**(-0.5)'
    latex: \sigma_8/h^{0.5}
  s8omegamp5:
    derived: 'lambda sigma8, omegam: sigma8*omegam**0.5'
    latex: \sigma_8 \Omega_\mathrm{m}^{0.5}
  s8omegamp25:
    derived: 'lambda sigma8, omegam: sigma8*omegam**0.25'
    latex: \sigma_8 \Omega_\mathrm{m}^{0.25}
  s8:
    derived: 'lambda sigma8, omegam: sigma8*(omegam/0.3)**0.5'
    latex: S_8
  age:
    latex: '{\rm{Age}}/\mathrm{Gyr}'
  rdrag:
    latex: r_\mathrm{drag}
  yheused:
    latex: Y_P^\mathrm{BBN}
  omegan2:
    latex: \Omega_\mathrm{\\nu} h^2
  omegan:
    derived: 'lambda omegan2, H0: omegan2/((H0/100)**2)'
    latex: \Omega_\mathrm{\nu}
  # ----------------------------------------------------------------------------
  # The nuisance parameters (sources, redMaGiC lenses) and their priors come
  # from the likelihood defaults: likelihood/params_source.yaml (DES Y3
  # Metacal values) and params_lens_redmagic.yaml. The TATT terms (DES_A2_1,
  # DES_A2_2, DES_BTA_1) are sampled there, so they need a value below even
  # though NLA (IA_model: 0) ignores them.
  # ----------------------------------------------------------------------------

theory:
  camb:
    path: ./external_modules/code/CAMB
    stop_at_error: False
    use_renames: True
    extra_args:
      halofit_version: takahashi
      AccuracyBoost: 1.0
      lens_potential_accuracy: 1.0
      num_massive_neutrinos: 1
      nnu: 3.046
      dark_energy_model: ppf
      accurate_massive_neutrino_transfers: false
      k_per_logint: 12
      kmax: 10

sampler:
  evaluate:
    N: 1
    override:
      As_1e9: 2.1
      ns: 0.96605
      H0: 67.32
      omegab: 0.04
      omegam: 0.3
      mnu: 0.06
      w0pwa: -1.0
      w: -1.0
      # sources: photo-z shift, shear calibration (the means of their priors)
      DES_DZ_S1: 0.0
      DES_DZ_S2: 0.0
      DES_DZ_S3: 0.0
      DES_DZ_S4: 0.0
      DES_M1: -0.0063
      DES_M2: -0.0198
      DES_M3: -0.0241
      DES_M4: -0.0369
      # intrinsic alignment: amplitude a1 and redshift power eta1 (NLA);
      # a2 (DES_A2_1), eta2 (DES_A2_2) and b_TA (DES_BTA_1) enter only under
      # TATT (IA_model: 1), and a2 = b_TA = 0 switches those terms off
      DES_A1_1: 0.7
      DES_A1_2: -1.7
      DES_A2_1: 0.0
      DES_A2_2: -1.51541
      DES_BTA_1: 0.0
      # redMaGiC lenses: photo-z shift (the means of their priors), photo-z
      # stretch of bin 5 (the only sampled one), linear bias
      DES_DZ_L1: 0.006
      DES_DZ_L2: 0.001
      DES_DZ_L3: 0.004
      DES_DZ_L4: -0.002
      DES_DZ_L5: -0.007
      DES_DZ2_L5: 1.23
      DES_B1_1: 1.7
      DES_B1_2: 1.7
      DES_B1_3: 1.7
      DES_B1_4: 2.0
      DES_B1_5: 2.0
      # point mass of gamma_t
      DES_PM1: 0.0
      DES_PM2: 0.0
      DES_PM3: 0.0
      DES_PM4: 0.0
      DES_PM5: 0.0
output: ./projects/des_cluster/chains/EXAMPLE_EVALUATE4
