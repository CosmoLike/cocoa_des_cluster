timing: True
debug: False
stop_at_error: True

# CL+GC (4x2pt + N) of arXiv 2503.13631 on the synthetic DES Y6-like data:
# cluster counts N, cluster lensing (Sigma = Y gamma_t), cluster clustering
# w_cc, cluster x galaxy w_cg and galaxy clustering w_gg (MagLim bins 1-3).
# The data vector is the model at the point of the evaluate block below
# (scripts/make_synthetic_data.py, Table I of the paper), so chi2 ~ 0 there.
likelihood:
  des_cluster.combo_4x2pt_N:
    path: ./external_modules/data/des_cluster
    data_file: des_cluster_y6_4x2ptN.dataset
    print_datavector: False
    print_datavector_file: "./projects/des_cluster/chains/theory_4x2pt_N.modelvector"
    # WARNING: keep accuracyboost <= 3 (above it the integration tables of the
    # donor project desy1xplanck broke down; not re-measured here).
    accuracyboost: 1.0
    # integer 0, 1 or 2; 1 for the Y6 inputs (the MagLim lens n(z) tails reach
    # z = 2.99: delta chi2 vs high accuracy 1.65 at 0, 0.048 at 1)
    integration_accuracy: 1
    lmax: 75000 # lmax computed for real space correlation function
    kmax_boltzmann: 10.0
    # 1 EE2, 2 Halofit
    non_linear_emul: 2
    IA_model: 0 # NLA (0); the cluster lensing code has no TATT
    IA_code: 0  # CFASTPT (0) or FASTPT (1) (only works if not NLA)
    IA_redshift_evolution: 3
    debug: false
    # radial kernel of clusters in the 2pt functions: 0 = volume only (what
    # DES ran), 1 = abundance weighted
    cluster_kernel_mode: 0
    # selection bias: 0 = none, 1 = Y1 (mass dependent), 2 = Y6 (scale
    # dependent, on the data vector; eq 23)
    cluster_selection_model: 2
    # cluster lensing: 1 = Sigma = Y gamma_t (eq 15), 0 = gamma_t (the data
    # and covariance files must be in the same space)
    cluster_ytransform: 1
    # 1 = intrinsic alignment of the sources in the 2-halo cluster-lensing term
    cluster_include_ia: 1
    # cluster magnification coefficient C_c (eq 28: -2); 0 switches it off
    cluster_magnification: -2.0
    # Tinker 2010 amplitude: 0 = 0.368 at every z (what DES ran), 1 = alpha(z)
    cluster_hmf_alpha_mode: 0
    # w_cc and w_cg: 1 = Limber at every multipole, 0 = non-Limber
    cluster_adopt_limber_cc: 1
    cluster_adopt_limber_cg: 1

params:
  As_1e9:
    prior:
      min: 0.5
      max: 5
    ref:
      dist: norm
      loc: 2.1
      scale: 0.2
    proposal: 0.2
    latex: 10^9 A_\mathrm{s}
    drop: true
    renames: A
  ns:
    prior:
      min: 0.87
      max: 1.07
    ref:
      dist: norm
      loc: 0.96605
      scale: 0.01
    proposal: 0.01
    latex: n_\mathrm{s}
  H0:
    prior:
      min: 55
      max: 91
    ref:
      dist: norm
      loc: 67.32
      scale: 3
    proposal: 3
    latex: H_0
  omegab:
    prior:
      min: 0.03
      max: 0.07
    ref:
      dist: norm
      loc: 0.0495
      scale: 0.004
    proposal: 0.004
    latex: \Omega_\mathrm{b}
    drop: true
  omegam:
    prior:
      min: 0.1
      max: 0.9
    ref:
      dist: norm
      loc: 0.316
      scale: 0.015
    proposal: 0.015
    latex: \Omega_\mathrm{m}
    drop: true
  w:
    prior:
      min: -3
      max: -0.01
    ref:
      dist: norm
      loc: -0.99
      scale: 0.05
    proposal: 0.05
    latex: w_{0,\mathrm{DE}}
  w0pwa:
    prior:
      min: -5
      max: -0.01
    ref:
      dist: norm
      loc: -0.99
      scale: 0.05
    proposal: 0.05
    latex: w_{0,\mathrm{DE}}+w_{a,\mathrm{DE}}
    drop: true
  wa:
    value: 'lambda w0pwa, w: w0pwa - w'
    latex: w_{a,\mathrm{DE}}
  mnu:
    prior:
      min: 0.06
      max: 0.6
    ref:
      dist: norm
      loc: 0.25
      scale: 0.1
    proposal: 0.05
  tau:
    value: 0.0697186
    latex: \tau_\mathrm{reio}
  # ---------------------------------------------------------------------------------------
  # ------------------------------------- DERIVED PARAMETERS ------------------------------
  # ---------------------------------------------------------------------------------------
  # WARNING: DO NOT REMOVE omegabh2/omegach2/omegamh2/wa/As/ FROM DERIVED PARAMETERS
  # SEE: github.com/CosmoLike/cocoa#warning-warning-warning-weak-lensing-yaml-files-in-cobaya-
  # ---------------------------------------------------------------------------------------
  As:
    value: 'lambda As_1e9: 1e-9 * As_1e9'
    latex: A_\mathrm{s}
  omegabh2:
    value: 'lambda omegab, H0: omegab*(H0/100)**2'
    latex: \Omega_\mathrm{b} h^2
  omegach2:
    value: 'lambda omegam, omegab, mnu, H0: (omegam-omegab)*(H0/100)**2-(mnu*(3.046/3)**0.75)/94.0708'
    latex: \Omega_\mathrm{c} h^2
  omegal:
    latex: \Omega_\Lambda
  omegamh2:
    derived: 'lambda omegam, H0: omegam*(H0/100)**2'
    latex: \Omega_\mathrm{m} h^2
  sigma8:
    latex: \sigma_8
  s8h5:
    derived: 'lambda sigma8, H0: sigma8*(H0*1e-2)**(-0.5)'
    latex: \sigma_8/h^{0.5}
  s8omegamp5:
    derived: 'lambda sigma8, omegam: sigma8*omegam**0.5'
    latex: \sigma_8 \Omega_\mathrm{m}^{0.5}
  s8omegamp25:
    derived: 'lambda sigma8, omegam: sigma8*omegam**0.25'
    latex: \sigma_8 \Omega_\mathrm{m}^{0.25}
  s8:
    derived: 'lambda sigma8, omegam: sigma8*(omegam/0.3)**0.5'
    latex: S_8
  age:
    latex: '{\rm{Age}}/\mathrm{Gyr}'
  rdrag:
    latex: r_\mathrm{drag}
  yheused:
    latex: Y_P^\mathrm{BBN}
  omegan2:
    latex: \Omega_\mathrm{\\nu} h^2
  omegan:
    derived: 'lambda omegan2, H0: omegan2/((H0/100)**2)'
    latex: \Omega_\mathrm{\nu}
  # ----------------------------------------------------------------------------
  # The nuisance parameters (sources, MagLim lenses, clusters) and their
  # priors come from the likelihood defaults: likelihood/params_source_y6.yaml,
  # params_lens_maglim.yaml and params_cluster.yaml. CL+GC fixes the bias and
  # photo-z shift of lens bins 4-6 (fixed_params of combo_4x2pt_N.yaml).
  # ----------------------------------------------------------------------------

theory:
  camb:
    path: ./external_modules/code/CAMB
    stop_at_error: False
    use_renames: True
    extra_args:
      halofit_version: takahashi
      AccuracyBoost: 1.0
      lens_potential_accuracy: 1.0
      num_massive_neutrinos: 1
      nnu: 3.046
      dark_energy_model: ppf
      accurate_massive_neutrino_transfers: false
      k_per_logint: 12
      kmax: 10

sampler:
  evaluate:
    N: 1
    override:
      # Table I of arXiv 2503.13631 (the point of the synthetic data vector)
      As_1e9: 2.19
      ns: 0.96859
      H0: 69.0
      omegab: 0.048
      omegam: 0.3
      # Omega_nu h^2 = 0.00083: mnu = 0.00083 x 94.0708/(3.046/3)^0.75 eV
      mnu: 0.07719273818983689
      w0pwa: -1.0
      w: -1.0
      # sources: photo-z shift, shear calibration
      DES_DZ_S1: 0.034
      DES_DZ_S2: 0.028
      DES_DZ_S3: 0.011
      DES_DZ_S4: -0.010
      DES_M1: 0.0
      DES_M2: 0.0
      DES_M3: 0.0
      DES_M4: 0.0
      # NLA: amplitude a1, redshift power eta1
      DES_A1_1: 0.0
      DES_A1_2: 0.0
      # MagLim lenses (bins 1-3): photo-z shift, linear bias
      DES_DZ_L1: 0.005
      DES_DZ_L2: 0.003
      DES_DZ_L3: 0.001
      DES_B1_1: 1.42
      DES_B1_2: 1.66
      DES_B1_3: 1.70
      # point mass of gamma_t (no gamma_t in CL+GC: these only sit on their
      # priors)
      DES_PM1: 0.0
      DES_PM2: 0.0
      DES_PM3: 0.0
      DES_PM4: 0.0
      DES_PM5: 0.0
      DES_PM6: 0.0
      # clusters: mass-observable relation (eqs 18-19)
      DES_CL_LNLAMBDA0: 4.26
      DES_CL_A_LAMBDA: 0.943
      DES_CL_SIGMA_INT: 0.15
      DES_CL_B_LAMBDA: 0.207
      # clusters: selection bias (eq 23)
      DES_CL_BS1: 1.1
      DES_CL_BS2: 0.2
      DES_CL_R0: 30.0
output: ./projects/des_cluster/chains/EXAMPLE_EVALUATE1
