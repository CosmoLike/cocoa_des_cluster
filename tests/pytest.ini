[pytest]
# An unqualified run from tests/ selects data-vector checks.
# Pass covariance/ explicitly for covariance construction.
testpaths = data_vector
# -s streams each test's explanation report to the terminal as it runs
# (pytest would otherwise capture it and print only a bare PASSED)
addopts = -v -s -p no:cacheprovider
# The Python reference model (tests/reference), the lighthouse
# reference outputs and the C-vs-reference validation (tests/validation)
# are validation infrastructure, not the project's unit tests: run
# them explicitly (pytest tests/reference; python
# tests/validation/compare_reference.py).
norecursedirs = .* __pycache__ frozen reference lighthouse_reference validation
