[pytest]
# -s streams each test's explanation report to the terminal as it runs
# (pytest would otherwise capture it and print only a bare PASSED)
addopts = -v -s -p no:cacheprovider
# The Python reference model (tests/reference) and the lighthouse
# reference outputs are validation infrastructure, not the project's
# accuracy suite: run them explicitly (pytest tests/reference).
norecursedirs = .* __pycache__ frozen reference lighthouse_reference
