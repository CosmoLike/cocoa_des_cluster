path: null
data_file: des_cluster_y6_4x2ptN.dataset
# WARNING: keep accuracyboost <= 3 (above it the integration tables of the
# donor project desy1xplanck broke down; not re-measured here).
accuracyboost: 1.0
internal_accuracyboost: 1.0 # C-FAST-PT convolution grid / output grid
# refinements on top of accuracyboost (which multiplies them too):
# the non-Limber FFTLog chi grid, and the z nodes of the P(k) tables
nonlimber_accuracyboost: 1.0
pk_z_refinement: 1
# integer 0, 1 or 2. 1 for the Y6 inputs: the knob sweep (tests/validation/
# knob_sweep.py) gives delta chi2 1.65 at 0 vs high accuracy (galaxy gammat
# 0.92, w_gg 0.47: the MagLim lens n(z) tails reach z = 2.99) and 0.048 at 1
# (cluster blocks 6e-3 either way), for ~30% more cosmolike time.
integration_accuracy: 1
# n(z) interpolation: 0 = cubic spline, 1 = linear, 2+ = Steffen (monotone)
photoz_interpolation_type: 0
# n(z) file z column: 0 = Z_LOW (left bin edges), 1 = Z_MID (sample points)
photoz_zmid_convention: 0
# galaxy-galaxy lensing: 1 = Limber at every multipole, 0 = non-Limber below l = 150
adopt_limber_gs: 1
# galaxy clustering: 0 = non-Limber below l = 150, 1 = Limber at every multipole
adopt_limber_gg: 0
# galaxy probes: 0 = perturbative galaxy bias, 1 = halo-model (HOD) galaxy
# power (Limber only: needs adopt_limber_gg = adopt_limber_gs = 1)
include_HOD_GX: 0
# shear and ggl IA: 0 = the IA_model above, 1 = halo-model IA
# (Fortuna et al. 2021; NLA only, Limber gs, include_HOD_GX = 0)
include_halo_IA: 0
# halo model: density field of sigma(M) and dn/dM, clusters included.
# 0 = total matter; 1 = cold dark matter + baryons, as the massive
# neutrinos free-stream out of halos (the DES Y1 cluster model; sigma(M)
# from CAMB's delta_nonu P(k); the emulator path approximates it). The
# shipped synthetic data and covariance are made with 1
halo_matter_field: 1
lmax: 75000 
kmax_boltzmann: 10.0
speed: 1
non_linear_emul: 2
external_nz_modeling: 0
use_emulator: 0
debug: False
# IA REDSHIFT EVOLUTION: 0 = NO_IA (AMPLITUDES SET TO ZERO), 
#                        1 = IA_NLA_LF
#                        2 = IA_REDSHIFT_BINNING, 
#                        3 = IA_REDSHIFT_EVOLUTION
IA_redshift_evolution: 3
# IA_MODEL: 0 = NLA, 1 = TATT
IA_model: 0 
# IA_code: 0 = C FASTPT, 1 = Python PAST-PT
IA_code: 0

# BIAS REDSHIFT EVOLUTION [b1,b2,bs2,b3,bmag] (see bias.c)
bias_model: [0,0,0,1,0]

# ----------------------------------------------------------------------------
# CLUSTERS (arXiv 2503.13631; the Y1 choices of arXiv 2008.10757 as switches)
# ----------------------------------------------------------------------------
# radial kernel of clusters in the 2pt functions:
#   0 = volume only, dV/dz <phi_i|z> (Y1 eq 15; what DES ran)
#   1 = abundance weighted, dV/dz <phi_i|z> n_lambda(z)
cluster_kernel_mode: 0
# selection bias: 0 = none
#                 1 = Y1, mass dependent, inside the bias mass integral
#                 2 = Y6, scale dependent, on the data vector (eq 23)
cluster_selection_model: 2
# cluster lensing: 1 = Sigma = Y gamma_t (eq 15, Park et al. 2021), 0 = gamma_t
# (the data and covariance files must be in the same space)
cluster_ytransform: 1
# 1 = intrinsic alignment of the sources in the 2-halo cluster-lensing term
cluster_include_ia: 1
# cluster magnification coefficient C_c (eq 28: -2); 0 switches it off
cluster_magnification: -2.0
# amplitude alpha of the Tinker 2010 cluster mass function (same shape):
#   0 = 0.368 at every z (arXiv 1001.3162 Table 4; what DES ran)
#   1 = alpha(z) from int b f dnu = 1 (halo.c; 3-9% fewer clusters at z = 0.2-0.6)
cluster_hmf_alpha_mode: 0
# w_cc and w_cg: 1 = Limber at every multipole, 0 = non-Limber
cluster_adopt_limber_cc: 1
cluster_adopt_limber_cg: 1

add_baryons_on_dv: False
which_bsims_add_on_dv: "antilles-2"

use_baryon_pca: False
create_baryon_pca: False
baryon_pca_select_sims: "antilles-2-99/antilles-101-378/antilles-380-400"
filename_baryon_pca: "./projects/des_cluster/chains/pca.txt"
external_baryon_suppression: False

print_datavector: False
print_datavector_file: "./projects/des_cluster/chains/theory_4x2pt_N.modelvector"

# CL+GC (Table I of arXiv 2503.13631) varies the MagLim bias and photo-z
# shift of lens bins 1-3 only: bins 4-6 are fixed at their
# params_lens_maglim.yaml fiducials. Each entry replaces the parameter's
# default (a value drops prior, ref and proposal, the cobaya merge rule);
# see _cosmolike_prototype_base.get_modified_defaults.
# The point masses act on galaxy-galaxy lensing gamma_t only (eq 14). CL+GC
# has no gamma_t block (its mask removes `gs`), so its data vector does not
# move with them: they are fixed at zero, not sampled.
fixed_params:
  DES_B1_4:
    value: 1.62
  DES_B1_5:
    value: 1.78
  DES_B1_6:
    value: 1.75
  DES_DZ_L4:
    value: -0.002
  DES_DZ_L5:
    value: 0.001
  DES_DZ_L6:
    value: 0.008
  DES_PM1:
    value: 0.0
  DES_PM2:
    value: 0.0
  DES_PM3:
    value: 0.0
  DES_PM4:
    value: 0.0
  DES_PM5:
    value: 0.0
  DES_PM6:
    value: 0.0

params: !defaults [params_source_y6, params_lens_maglim, params_cluster]
