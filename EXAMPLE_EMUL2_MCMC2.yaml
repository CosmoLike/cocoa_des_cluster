timing: False
debug: False
stop_at_error: False

# CL+3x2pt (6x2pt + N) of arXiv 2503.13631 on the synthetic DES Y6-like data:
# the CL+GC blocks (cluster counts N, cluster lensing Sigma = Y gamma_t,
# cluster clustering w_cc, cluster x galaxy w_cg) plus the galaxy 3x2pt
# (cosmic shear, galaxy-galaxy lensing, galaxy clustering; MagLim bins 1-6).
# The data vector is the model at the point of the evaluate block below
# (scripts/make_synthetic_data.py, Table I of the paper), so chi2 ~ 0 there.
# Hybrid (EMUL2) version: cosmolike computes the data vector, but the
# Boltzmann inputs (distances, linear and nonlinear P(k)) come from the
# neural-network emulators of the theory block instead of CAMB, so nearly
# all the run time is cosmolike. The emulators are trained at mnu = 0.06
# eV, while the synthetic data vector was generated with CAMB at
# Omega_nu h^2 = 0.00083 (mnu = 0.077 eV): chi2 at the point below is
# small but not zero.
# Cosmology: LCDM as in the paper (w = -1, w0 + wa = -1 fixed). To sample
# w0-wa, give `w` and `w0pwa` a prior as in the EVALUATE examples.
likelihood:
  des_cluster.combo_6x2pt_N:
    use_emulator: 2
    path: ./external_modules/data/des_cluster
    data_file: des_cluster_y6_6x2ptN.dataset
    print_datavector: False
    print_datavector_file: "./projects/des_cluster/chains/theory_6x2pt_N.modelvector"
    # WARNING: keep accuracyboost <= 3 (above it the integration tables of the
    # donor project desy1xplanck broke down; not re-measured here).
    accuracyboost: 1.0
    # integer 0, 1 or 2; 1 for the Y6 inputs (the MagLim lens n(z) tails reach
    # z = 2.99: delta chi2 vs high accuracy 1.65 at 0, 0.048 at 1)
    integration_accuracy: 1
    lmax: 75000 # lmax computed for real space correlation function
    kmax_boltzmann: 10.0
    # 1 EE2, 2 Halofit
    non_linear_emul: 2
    IA_model: 0 # NLA (0); the cluster lensing code has no TATT
    IA_code: 0  # CFASTPT (0) or FASTPT (1) (only works if not NLA)
    IA_redshift_evolution: 3
    debug: false
    # radial kernel of clusters in the 2pt functions: 0 = volume only (what
    # DES ran), 1 = abundance weighted
    cluster_kernel_mode: 0
    # selection bias: 0 = none, 1 = Y1 (mass dependent), 2 = Y6 (scale
    # dependent, on the data vector; eq 23)
    cluster_selection_model: 2
    # cluster lensing: 1 = Sigma = Y gamma_t (eq 15), 0 = gamma_t (the data
    # and covariance files must be in the same space)
    cluster_ytransform: 1
    # 1 = intrinsic alignment of the sources in the 2-halo cluster-lensing term
    cluster_include_ia: 1
    # cluster magnification coefficient C_c (eq 28: -2); 0 switches it off
    cluster_magnification: -2.0
    # Tinker 2010 amplitude: 0 = 0.368 at every z (what DES ran), 1 = alpha(z)
    cluster_hmf_alpha_mode: 0
    # w_cc and w_cg: 1 = Limber at every multipole, 0 = non-Limber
    cluster_adopt_limber_cc: 1
    cluster_adopt_limber_cg: 1

params:
  As_1e9:
    prior:
      min: 0.5
      max: 5
    ref:
      dist: norm
      loc: 2.1
      scale: 0.25
    proposal: 0.2
    latex: 10^9 A_\mathrm{s}
    renames: A
  ns:
    prior:
      min: 0.87
      max: 1.07
    ref:
      dist: norm
      loc: 0.96605
      scale: 0.01
    proposal: 0.01
    latex: n_\mathrm{s}
  H0:
    prior:
      min: 55
      max: 91
    ref:
      dist: norm
      loc: 67.32
      scale: 5
    proposal: 3
    latex: H_0
  omegab:
    prior:
      min: 0.03
      max: 0.07
    ref:
      dist: norm
      loc: 0.0495
      scale: 0.004
    proposal: 0.004
    latex: \Omega_\mathrm{b}
  omegam:
    prior:
      min: 0.1
      max: 0.9
    ref:
      dist: norm
      loc: 0.316
      scale: 0.01
    proposal: 0.01
    latex: \Omega_\mathrm{m}
  w0pwa:
    value: -1.0
    latex: w_{0,\mathrm{DE}}+w_{a,\mathrm{DE}}
  w:
    value: -1.0
    latex: w_{0,\mathrm{DE}}
  wa:
    value: 'lambda w0pwa, w: w0pwa - w'
    derived: false
    latex: 'w_{a,\mathrm{DE}}'
  mnu:
    value: 0.06
  omegabh2:
    value: 'lambda omegab, H0: omegab*(H0/100)**2'
    latex: \Omega_\mathrm{b} h^2
  omegach2:
    value: 'lambda omegam, omegab, mnu, H0: (omegam-omegab)*(H0/100)**2-(mnu*(3.046/3)**0.75)/94.0708'
    latex: \Omega_\mathrm{c} h^2
  As:
    value: 'lambda As_1e9: 1e-9 * As_1e9'
    latex: A_\mathrm{s}
  # ----------------------------------------------------------------------------
  # The nuisance parameters (sources, MagLim lenses, clusters) and their
  # priors come from the likelihood defaults: likelihood/params_source_y6.yaml,
  # params_lens_maglim.yaml and params_cluster.yaml. CL+3x2pt samples the
  # bias and photo-z shift of all six lens bins.
  # ----------------------------------------------------------------------------

theory:
  emulrdrag:
    path: ./cobaya/cobaya/theories/
    provides: ['rdrag']
    extra_args:
      file: ['external_modules/data/emultrf/BAO_SN_RES/emul_lcdm_rdrag_GP.joblib'] 
      extra: ['external_modules/data/emultrf/BAO_SN_RES/extra_lcdm_rdrag.npy'] 
      ord: [['omegabh2','omegach2']]
  emulbaosn:
    path: ./cobaya/cobaya/theories/
    stop_at_error: True
    provides: ['comoving_radial_distance', 'angular_diameter_distance', 'Hubble']
    extra_args:
      device: "cpu"
      file:  [None, 'external_modules/data/emultrf/BAO_SN_RES/w0wa/emul_w0wa_H.pt']
      extra: [None, 'external_modules/data/emultrf/BAO_SN_RES/w0wa/extra_w0wa_H.npy']    
      ord: [None, ['omegam','H0','w','wa']]
      extrapar: [{'MLA': 'INT', 'ZMIN' : 0.0001, 'ZMAX' : 3, 'NZ' : 600},
                 {'MLA': 'ResMLP', 'offset' : 0.0, 'INTDIM' : 4, 'NLAYER' : 6,
                  'TMAT': 'external_modules/data/emultrf/BAO_SN_RES/w0wa/PCA_w0wa_H.npy',
                  'ZLIN': 'external_modules/data/emultrf/BAO_SN_RES/w0wa/z_lin_w0wa.npy'}]
  emulmps:
    path: ./cobaya/cobaya/theories/
    stop_at_error: True
    extra_args:
      model_file:    "external_modules/data/emultrf/emulmps/npce_emul/emulator_npce.keras"
      metadata_file: "external_modules/data/emultrf/emulmps/npce_emul/metadata.joblib"
      nl_model_file:    "external_modules/data/emultrf/emulmps/w0wa_halofit/emulator_halofit.keras"
      nl_metadata_file: "external_modules/data/emultrf/emulmps/w0wa_halofit/metadata.joblib"
      use_syren: False
      param_order: ["As_1e9", "ns", "H0", "omegab", "omegam", 'w', 'wa']
sampler:
  mcmc:
    # ---------------------------------------------------------------------
    # File (w/ path) or matrix defining a covariance matrix for the proposal:
    # - null (default): will be generated from params info (prior and proposal)
    # - matrix: remember to set `covmat_params` to the parameters in the matrix
    # (no covmat is shipped for the cluster combos: the first run learns it)
    covmat: null
    covmat_params:
    # ---------------------------------------------------------------------
    # ---------------------------------------------------------------------
    # Proposal covariance matrix learning
    # ---------------------------------------------------------------------
    # ---------------------------------------------------------------------
    learn_proposal: True
    # Don't learn if convergence better than...
    learn_proposal_Rminus1_min: 0.035
    # Don't learn if convergence is worse than...
    learn_proposal_Rminus1_max: 150
    # (even earlier if a param is not in the given covariance matrix)
    learn_proposal_Rminus1_max_early: 300.
    # ---------------------------------------------------------------------
    # ---------------------------------------------------------------------
    # Convergence and stopping
    # ---------------------------------------------------------------------
    # ---------------------------------------------------------------------
    # Maximum number of posterior evaluations
    max_samples: .inf
    # Gelman-Rubin R-1 on means
    Rminus1_stop: 0.02
    # Gelman-Rubin R-1 on std deviations
    Rminus1_cl_stop: 0.2
    Rminus1_cl_level: 0.95
    # ---------------------------------------------------------------------
    # ---------------------------------------------------------------------
    # Exploiting speed hierarchy
    # ---------------------------------------------------------------------
    # ---------------------------------------------------------------------
    measure_speeds: False
    drag: False
    oversample_power: 0.2
    oversample_thin: True
    # speeds are estimates (measure_speeds is off): with the emulated
    # Boltzmann inputs a cosmology step costs one full cosmolike refill, a
    # nuisance step a partial one; shear calibration only rescales blocks
    blocking:
      - [1,
          [
            As_1e9, ns, H0, omegab, omegam
          ]
        ]
      - [2,
          [
            DES_DZ_S1, DES_DZ_S2, DES_DZ_S3, DES_DZ_S4, DES_A1_1, DES_A1_2,
            DES_DZ_L1, DES_DZ_L2, DES_DZ_L3, DES_DZ_L4, DES_DZ_L5, DES_DZ_L6,
            DES_B1_1, DES_B1_2, DES_B1_3, DES_B1_4, DES_B1_5, DES_B1_6,
            DES_PM1, DES_PM2, DES_PM3, DES_PM4, DES_PM5, DES_PM6,
            DES_CL_LNLAMBDA0, DES_CL_A_LAMBDA, DES_CL_SIGMA_INT,
            DES_CL_B_LAMBDA, DES_CL_BS1, DES_CL_BS2, DES_CL_R0
          ]
        ]
      - [25,
          [
            DES_M1, DES_M2, DES_M3, DES_M4
          ]
        ]
    # ---------------------------------------------------------------------
    # ---------------------------------------------------------------------
    # Avoid chain getting suck forever
    # ---------------------------------------------------------------------
    # ---------------------------------------------------------------------
    max_tries: 10000
    burn_in: 0
    # ---------------------------------------------------------------------
    # ---------------------------------------------------------------------
    # When no MPI used, number of fractions of the chain to compare
    # ---------------------------------------------------------------------
    # ---------------------------------------------------------------------
    Rminus1_single_split: 4

output: ./projects/des_cluster/chains/EXAMPLE_EMUL2_MCMC2
